services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnstream_db
      POSTGRES_USER: learnstream
      POSTGRES_PASSWORD: learnstream_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnstream -d learnstream_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://learnstream:learnstream_dev@postgres:5432/learnstream_db
      JWT_SECRET: dev_jwt_secret
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3011
      PORT: 3000
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: email@company.com
      SMTP_PASS: pass put here
      SMTP_FROM: LearnStream <email@company.com>
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/prisma.config.ts:/app/prisma.config.ts
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3011:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3010
      INTERNAL_API_URL: http://backend:3000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/messages:/app/messages
    depends_on:
      - backend

volumes:
  postgres_data:
